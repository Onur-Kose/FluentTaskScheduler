imeline li{position:relative;padding:0 0 19px 22px;border-left:1px solid #e2eae4;margin-left:5px}.timeline li:last-child{border-left-color:transparent}.timeline li:before{content:"";position:absolute;left:-5px;top:1px;width:9px;height:9px;border-radius:50%;background:#37a982;box-shadow:0 0 0 3px #e4f5ec}.timeline li.failed:before,.timeline li.timedout:before{background:#d87558;box-shadow:0 0 0 3px #ffebe3}.timeline-title{font-size:11px;color:#34483d;font-weight:750}.timeline-sub{font-size:10px;color:#97a79d;margin-top:5px;line-height:1.5}.timeline-error{font-size:10px;color:#ad604a;margin-top:5px;overflow-wrap:anywhere}.no-history{font-size:11px;color:#9cab9f}
    @media(max-width:1200px){.content{grid-template-columns:1fr}.activity{max-height:300px}}@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px 20px 40px}}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.topbar{display:block}.connection{margin-top:19px;display:inline-flex}.drawer-top,.drawer-body{padding-left:20px;padding-right:20px}}@media(max-width:420px){.card{padding:15px}.card-main strong{font-size:24px}.search{width:100%}.detail-grid{grid-template-columns:1fr}}
    /* Fluent 2 inspired alias tokens and control treatments. */
    :root{font-family:"Segoe UI",SegoeUI,Arial,sans-serif;color:#242424;background:#fafafa;
      --colorNeutralBackground1:#fff;--colorNeutralBackground2:#fafafa;--colorNeutralBackground3:#f5f5f5;
      --colorNeutralForeground1:#242424;--colorNeutralForeground2:#424242;--colorNeutralForeground3:#616161;
      --colorNeutralStroke1:#d1d1d1;--colorNeutralStroke2:#e0e0e0;--colorBrandBackground:#0f6cbd;
      --colorBrandBackground2:#e5f1fb;--colorBrandForeground1:#0f6cbd;--colorStatusDangerBackground1:#fdf3f4;
      --colorStatusDangerForeground1:#b10e1c;--colorStatusSuccessBackground1:#eaf7ed;--colorStatusSuccessForeground1:#107c10;
      --colorStatusWarningBackground1:#fff4ce;--colorStatusWarningForeground1:#8a6400}
    body{background:var(--colorNeutralBackground2);color:var(--colorNeutralForeground1)}.app{display:block}
    .sidebar{background:var(--colorNeutralBackground3);border-right:1px solid var(--colorNeutralStroke2);gap:32px}
    .logo{color:var(--colorNeutralForeground1);font-weight:600;font-size:14px;letter-spacing:0}.logo-icon{background:var(--colorBrandBackground);color:#fff;border-radius:6px;font-size:17px}
    .nav-label{color:var(--colorNeutralForeground3);letter-spacing:0;font-size:11px;text-transform:none}.nav-item{background:var(--colorBrandBackground2);color:var(--colorBrandForeground1);border-radius:4px;font-weight:600}.nav-icon{background:transparent;color:var(--colorBrandForeground1)}
    .main{padding-top:34px}.topbar{margin-bottom:28px}.topbar h1{font-size:28px;font-weight:600;letter-spacing:0;color:var(--colorNeutralForeground1)}
    .connection{background:var(--colorNeutralBackground1);border:1px solid var(--colorNeutralStroke2);border-radius:6px;color:var(--colorNeutralForeground2);box-shadow:none;font-size:12px}.connection time{color:var(--colorNeutralForeground3)}
    .live-dot{background:var(--colorStatusSuccessForeground1);box-shadow:none}.live-dot.off{background:#c19c00;box-shadow:none}
    .cards{gap:12px}.card,.panel{background:var(--colorNeutralBackground1);border:1px solid var(--colorNeutralStroke2);border-radius:8px;box-shadow:0 2px 6px #0000000a}.card{padding:16px 20px}.card-title{color:var(--colorNeutralForeground2);font-size:12px;font-weight:400}.card-main{margin-top:8px}.card-main strong{font-size:28px;font-weight:600;color:var(--colorNeutralForeground1);letter-spacing:0}.card-icon,.card-foot{display:none}
    .panel-header{padding:20px}.panel h2{color:var(--colorNeutralForeground1);font-weight:600;font-size:16px;letter-spacing:0}.count{background:var(--colorNeutralBackground3);color:var(--colorNeutralForeground2);border:0;border-radius:4px}
    .toolbar{padding:0 20px 14px}.filter{font-weight:500;font-size:12px;color:var(--colorNeutralForeground2);border-radius:4px}.filter:hover{background:var(--colorNeutralBackground3)}.filter.active{color:var(--colorBrandForeground1);background:var(--colorBrandBackground2);border-color:transparent}
    .search{border:1px solid var(--colorNeutralStroke1);border-radius:4px;font-size:12px;color:var(--colorNeutralForeground1);height:34px}.search::placeholder{color:var(--colorNeutralForeground3)}
    .jobs th{background:var(--colorNeutralBackground2);color:var(--colorNeutralForeground2);font-size:11px;letter-spacing:0;text-transform:none;border-color:var(--colorNeutralStroke2)}.jobs td{color:var(--colorNeutralForeground2);border-color:var(--colorNeutralStroke2);font-size:12px}.jobs tbody tr:hover{background:var(--colorNeutralBackground2)}
    .job-button{color:var(--colorNeutralForeground1);font-size:13px;font-weight:600}.job-button:hover{color:var(--colorBrandForeground1)}.job-key{color:var(--colorNeutralForeground3);font-size:11px}
    .status{border-radius:4px;font-size:11px;font-weight:600;background:var(--colorNeutralBackground3);color:var(--colorNeutralForeground2)}.status.running{background:var(--colorBrandBackground2);color:var(--colorBrandForeground1)}.status.succeeded{background:var(--colorStatusSuccessBackground1);color:var(--colorStatusSuccessForeground1)}
    .status.failed,.status.timedout,.status.unavailable,.status.checkpointfailed,.status.timeoutcancellationrequested{background:var(--colorStatusDangerBackground1);color:var(--colorStatusDangerForeground1)}.status.paused{background:var(--colorStatusWarningBackground1);color:var(--colorStatusWarningForeground1)}
    .activity-item{border-color:var(--colorNeutralStroke2)}.activity-icon{border-radius:4px;background:var(--colorStatusSuccessBackground1);color:var(--colorStatusSuccessForeground1)}.activity-icon.failed,.activity-icon.timedout{background:var(--colorStatusDangerBackground1);color:var(--colorStatusDangerForeground1)}.activity-text strong{color:var(--colorNeutralForeground1)}.activity-text small,.activity-time{color:var(--colorNeutralForeground3)}
    .drawer{box-shadow:-8px 0 32px #00000024}.drawer-top{border-color:var(--colorNeutralStroke2)}.drawer-kicker{color:var(--colorNeutralForeground3);letter-spacing:0;text-transform:none}.drawer h2{color:var(--colorNeutralForeground1);font-size:22px;letter-spacing:0;font-weight:600}.drawer-key{color:var(--colorNeutralForeground3)}.close{border-color:var(--colorNeutralStroke1);color:var(--colorNeutralForeground2);border-radius:4px}
    .section h3{color:var(--colorNeutralForeground1);font-size:13px;font-weight:600}.detail-box{background:var(--colorNeutralBackground2);border-color:var(--colorNeutralStroke2);border-radius:4px}.detail-box span{color:var(--colorNeutralForeground3)}.detail-box strong{color:var(--colorNeutralForeground1);font-size:12px;font-weight:600}
    .error-box{background:var(--colorStatusDangerBackground1);border-color:#efc4c7;border-radius:4px}.error-box strong,.error-box p{color:var(--colorStatusDangerForeground1)}.error-meta code{background:#f9dfe1;color:var(--colorStatusDangerForeground1)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--colorBrandBackground);outline-offset:2px}
  </style>

<body>
  <div class="app">
    
    <main class="main"><header class="topbar"><div><h1>Görev panosu</h1></div><div class="connection"><span id="live-dot" class="live-dot off"></span><span id="live-label">Bağlanıyor</span><time id="updated">—</time></div></header>
      <div id="alert" class="alert" role="alert"></div>
      <section class="cards" aria-label="Görev özeti"><div class="card"><div class="card-title">Toplam görev</div><div class="card-main"><strong id="total">—</strong></div></div><div class="card working"><div class="card-title">Şu an çalışan</div><div class="card-main"><strong id="running">—</strong></div></div><div class="card failed"><div class="card-title">Sorunlu</div><div class="card-main"><strong id="failed">—</strong></div></div><div class="card paused"><div class="card-title">Duraklatılmış</div><div class="card-main"><strong id="paused">—</strong></div></div></section>
      <div class="content"><section class="panel"><div class="panel-header"><div><h2>Görevler</h2></div><span id="job-count" class="count">—</span></div><div class="toolbar"><div class="filters" role="group" aria-label="Görev filtresi"><button class="filter active" data-filter="all" type="button">Tümü</button><button class="filter" data-filter="running" type="button">Çalışan</button><button class="filter" data-filter="failed" type="button">Sorunlu</button><button class="filter" data-filter="paused" type="button">Duraklatılmış</button></div><input id="search" class="search" type="search" placeholder="Görev ara…" aria-label="Görev ara"></div><div class="table-wrap"><table class="jobs"><thead><tr><th>Görev</th><th>Durum</th><th>Son çalışma</th><th>Sonraki çalışma</th></tr></thead><tbody id="jobs-body"><tr><td class="empty" colspan="4">Yükleniyor…</td></tr></tbody></table></div></section><section class="panel"><div class="panel-header"><div><h2>Son etkinlikler</h2></div></div><div id="activity" class="activity"><div class="activity-empty">Yükleniyor…</div></div></section></div>
    </main>
  </div>
  <div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true"><div class="drawer-top"><div class="drawer-line"><span class="drawer-kicker">Görev ayrıntısı</span><button id="close" class="close" type="button" aria-label="Ayrıntıyı kapat">×</button></div><h2 id="detail-title">—</h2><div id="detail-key" class="drawer-key"></div><div id="detail-status" class="drawer-status"></div></div><div id="detail-body" class="drawer-body"></div></aside>
  <script>
    const api=location.pathname.replace(/\/$/,'')+'/api/status';
    const byId=id=>document.getElementById(id);
    const labels={Running:'Çalışıyor',Succeeded:'Başarılı',Failed:'Hata',TimedOut:'Zaman aşımı',TimeoutCancellationRequested:'Zaman aşımı bekleniyor',Unavailable:'Kullanılamıyor',CheckpointFailed:'Kayıt hatası',Paused:'Duraklatıldı',Scheduled:'Planlandı',Cancelled:'İptal edildi'};
    const problem=j=>['Failed','TimedOut','TimeoutCancellationRequested','Unavailable','CheckpointFailed'].includes(j.outcome)||!!j.error;
    const node=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n};
    const date=v=>v&&!v.startsWith('0001-')?new Date(v).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'}):'—';
    const preciseDate=v=>v&&!v.startsWith('0001-')?new Date(v).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'medium'}):'—';
    const clock=v=>v?new Date(v).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';
    const duration=v=>{if(!v)return'—';const parts=v.split(':');if(parts.length<3)return v;const seconds=Number(parts[2]);return Number(parts[0])*60+Number(parts[1])>0?`${Number(parts[0])*60+Number(parts[1])} dk ${seconds.toFixed(1)} sn`:`${seconds.toFixed(2)} sn`};
    let snapshot=null,filter='all',selected=null;
    function status(outcome){return node('span','status '+(outcome||'').toLowerCase(),labels[outcome]||outcome||'Bilinmiyor')}
    function detailBox(label,value){const box=node('div','detail-box');box.append(node('span','',label),node('strong','',value||'—'));return box}
    function section(title){const root=node('section','section');root.append(node('h3','',title));return root}
    function closeDetail(){selected=null;byId('drawer').classList.remove('open');byId('backdrop').classList.remove('open');byId('drawer').setAttribute('aria-hidden','true')}
    function openDetail(key){selected=key;renderDetail();byId('drawer').classList.add('open');byId('backdrop').classList.add('open');byId('drawer').setAttribute('aria-hidden','false');byId('close').focus()}
    function renderDetail(){
      if(!snapshot||!selected)return;const job=snapshot.jobs.find(j=>j.key===selected);if(!job){closeDetail();return}
      byId('detail-title').textContent=job.name;byId('detail-key').textContent=job.key;byId('detail-status').replaceChildren(status(job.outcome));
      const drawer=byId('drawer'),scroll=drawer.scrollTop,body=byId('detail-body');body.replaceChildren();
      const timing=section('Çalışma bilgileri'),grid=node('div','detail-grid');
      grid.append(detailBox('Son başlangıç',preciseDate(job.lastStartedUtc)),detailBox('Son bitiş',preciseDate(job.lastCompletedUtc)),detailBox('Son çalışma süresi',duration(job.lastDuration)),detailBox('Sonraki çalışma',job.isPaused?'Duraklatıldı':preciseDate(job.nextRunUtc)),detailBox('Son başarı',preciseDate(job.lastSuccessUtc)),detailBox('Ardışık hata',String(job.consecutiveFailures)));
      timing.append(grid);body.append(timing);
      const schedule=section('Zamanlama'),scheduleGrid=node('div','detail-grid');
      scheduleGrid.append(detailBox('Tekrarlama',job.repeatEvery||'Günlük zamanlama'),detailBox('Günlük saatler',(job.dailyAtTimes||[]).join(', ')||'—'));
      if(job.intervalStart||job.intervalEnd)scheduleGrid.append(detailBox('Çalışma aralığı',(job.intervalStart||'00:00')+' – '+(job.intervalEnd||'24:00')));
      if((job.excludedDays||[]).length)scheduleGrid.append(detailBox('Hariç tutulan günler',job.excludedDays.join(', ')));
      schedule.append(scheduleGrid);body.append(schedule);
      if(job.error){const errorSection=section('Son hata'),box=node('div','error-box');box.append(node('strong','','Hata ayrıntısı'),node('p','',job.error));const meta=node('div','error-meta');if(job.errorType)meta.append(node('code','',job.errorType));if(job.errorCode)meta.append(node('code','',job.errorCode));box.append(meta);errorSection.append(box);body.append(errorSection)}
      const history=section('Çalışma geçmişi'),events=(snapshot.recentEvents||[]).filter(e=>e.key===job.key).slice(0,15);
      if(!events.length)history.append(node('p','no-history','Henüz tamamlanan çalışma yok.'));
      else{const list=node('ol','timeline');for(const event of events){const item=node('li',(event.outcome||'').toLowerCase());item.append(node('div','timeline-title',labels[event.outcome]||event.outcome),node('div','timeline-sub',`${preciseDate(event.startedUtc)} → ${preciseDate(event.timestampUtc)} · ${duration(event.duration)}`));if(event.error)item.append(node('div','timeline-error',event.error));list.append(item)}history.append(list)}body.append(history);drawer.scrollTop=scroll;
    }
    function renderJobs(){const all=snapshot.jobs||[],query=byId('search').value.trim().toLocaleLowerCase('tr-TR');const jobs=all.filter(j=>(filter==='all'||(filter==='running'&&j.outcome==='Running')||(filter==='failed'&&problem(j))||(filter==='paused'&&j.isPaused))&&(!query||j.name.toLocaleLowerCase('tr-TR').includes(query)||j.key.toLocaleLowerCase('tr-TR').includes(query)));
      byId('job-count').textContent=jobs.length+' görev';const body=byId('jobs-body');body.replaceChildren();if(!jobs.length){const tr=node('tr'),td=node('td','empty',all.length?'Bu filtreyle eşleşen görev yok.':'Henüz kayıtlı görev yok.');td.colSpan=4;tr.append(td);body.append(tr);return}
      for(const job of jobs){const tr=node('tr'),first=node('td'),button=node('button','job-button',job.name);button.type='button';button.addEventListener('click',()=>openDetail(job.key));first.append(button,node('div','job-key',job.key));const statusCell=node('td');statusCell.append(status(job.outcome));tr.append(first,statusCell,node('td','',date(job.lastStartedUtc)),node('td','',job.isPaused?'Duraklatıldı':date(job.nextRunUtc)));body.append(tr)}
    }
    function renderActivity(){const root=byId('activity');root.replaceChildren();const events=(snapshot.recentEvents||[]).slice(0,8);if(!events.length){root.append(node('div','activity-empty','Henüz tamamlanan çalışma yok.'));return}for(const event of events){const item=node('div','activity-item'),icon=node('span','activity-icon '+(event.outcome||'').toLowerCase(),event.error?'!':'✓'),main=node('div','activity-text');main.append(node('strong','',event.name),node('small','',(labels[event.outcome]||event.outcome)+(event.duration?' · '+duration(event.duration):'')));item.append(icon,main,node('span','activity-time',clock(event.timestampUtc)));root.append(item)}}
    function render(data){snapshot=data;const jobs=data.jobs||[];byId('total').textContent=jobs.length;byId('running').textContent=jobs.filter(j=>j.outcome==='Running').length;byId('failed').textContent=jobs.filter(problem).length;byId('paused').textContent=jobs.filter(j=>j.isPaused).length;byId('live-dot').className='live-dot'+(data.isRunning?'':' off');byId('live-label').textContent=data.isRunning?(data.isHealthy?'Scheduler çalışıyor':'Scheduler sorun bildiriyor'):'Scheduler durdu';byId('updated').textContent='Güncellendi '+clock(data.timestampUtc);const alert=byId('alert');alert.textContent=data.error||'';alert.classList.toggle('show',!!data.error);renderJobs();renderActivity();renderDetail()}
    async function refresh(){try{const response=await fetch(api,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);render(await response.json())}catch(error){byId('live-dot').className='live-dot off';byId('live-label').textContent='Bağlantı yok';const alert=byId('alert');alert.textContent='Durum bilgisi alınamadı: '+error.message;alert.classList.add('show')}}
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('active',item===button));if(snapshot)renderJobs()}));
    byId('search').addEventListener('input',()=>{if(snapshot)renderJobs()});byId('close').addEventListener('click',closeDetail);byId('backdrop').addEventListener('click',closeDetail);document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDetail()});
    refresh();setInterval(refresh,5000);
  </script>
</body>
</html>
